<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Illustrated village map">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3d2e"/>
      <stop offset="100%" stop-color="#2f4f3a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7a8c"/>
      <stop offset="100%" stop-color="#2f5564"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="640" rx="28" fill="url(#land)"/>
  <path d="M80 520 C220 460 360 560 520 500 C680 440 820 540 940 480" stroke="#c49855" stroke-width="18" fill="none" opacity=".35" stroke-linecap="round"/>
  <path d="M80 520 C220 460 360 560 520 500 C680 440 820 540 940 480" stroke="#e8d2a8" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/>
  <ellipse cx="780" cy="220" rx="110" ry="70" fill="url(#water)" opacity=".9"/>
  <ellipse cx="780" cy="220" rx="70" ry="40" fill="#8eb8c4" opacity=".25"/>
  <g fill="#0f1a14" opacity=".35">
    <rect x="170" y="180" width="90" height="70" rx="8"/>
    <polygon points="170,180 215,140 260,180"/>
    <rect x="420" y="250" width="110" height="80" rx="8"/>
    <rect x="300" y="360" width="140" height="70" rx="10"/>
    <rect x="560" y="340" width="120" height="90" rx="10"/>
    <rect x="120" y="400" width="70" height="50" rx="8"/>
  </g>
  <g fill="#d4a45a" font-family="Georgia, serif" font-size="18">
    <text x="175" y="170">Temple</text>
    <text x="445" y="240">School</text>
    <text x="330" y="350">Ground</text>
    <text x="745" y="150">Lake</text>
    <text x="470" y="515">Main Road</text>
    <text x="575" y="330">Festival Area</text>
    <text x="95" y="390">Entrance</text>
  </g>
</svg>
