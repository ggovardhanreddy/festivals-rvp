name = "festivals-rvp"
pages_build_output_dir = "out"
compatibility_date = "2025-01-01"

# Cloudflare R2 — primary media storage (Pages hosts the app shell only)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reddivaripalli"
preview_bucket_name = "reddivaripalli"

# Login rate-limit counters (admin + Fun Fest)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "624eb2d060674aa586550f67487e5adb"
preview_id = "624eb2d060674aa586550f67487e5adb"

# Secrets (set via dashboard / wrangler pages secret — never commit values):
# ADMIN_PASSWORD_HASH
# ADMIN_SESSION_SECRET
# MEMBER_SESSION_SECRET
# MEDIA_SIGNING_SECRET
# R2_PUBLIC_BASE   (public bucket URL, e.g. https://pub-xxxxx.r2.dev or https://media.reddivaripalli.com)
