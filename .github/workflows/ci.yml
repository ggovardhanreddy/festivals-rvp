# Quality gates for pull requests. Main-branch deploys use deploy-cloudflare.yml
# (and optionally deploy.yml) so we avoid a second full build on every push.
name: CI

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Sync CMS + generate indexes
        run: npm run prepare:site
        env:
          CMS_READ_EXIF: "0"
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
      - run: npm run validate
      - run: npm test
      - name: Fun Fest credentials are not the compromised set
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const FILE = "functions/_data/member-auth.json";

            // Rotation writes its output OUTSIDE the repo, for upload to R2 as
            // auth/members.json. functions/_data/member-auth.json is only the
            // git fallback authMembers() uses when R2 is unreadable — so the
            // question this gate asks is not "did a script run" but "are the
            // credentials that would ship still the ones the audit flagged".
            if (!fs.existsSync(FILE)) {
              console.log("Git credential fallback removed; R2 is authoritative.");
              process.exit(0);
            }

            // sha256 over the sorted passwordHash values only. Ignores
            // generatedAt and updatedAt, so a build timestamp cannot look like
            // a rotation — which is exactly how 0dc81e8 slipped through review.
            const d = JSON.parse(fs.readFileSync(FILE, "utf8"));
            const digest = crypto
              .createHash("sha256")
              .update(d.members.map((m) => m.passwordHash).sort().join("|"))
              .digest("hex");

            const COMPROMISED =
              "06b9da598e614d2b1fe8f2bac65e73d1750d1664332c8e6f515bfa8612ebf0a6";

            if (digest === COMPROMISED) {
              console.error(
                "::error::The " + d.members.length + " Fun Fest credentials in " + FILE +
                " are the set the Phase 0 audit found derived from usernames. " +
                "Rotate before deploying:\n" +
                "  1. npm run rotate:members\n" +
                "  2. npx wrangler r2 object put reddivaripalli/auth/members.json \\\n" +
                "       --file ~/rvp-credentials/members-auth-<stamp>.json \\\n" +
                "       --content-type application/json --remote\n" +
                "  3. verify a member login against the deployed preview\n" +
                "  4. delete " + FILE + " (and its .ts module) so the fallback cannot serve them\n" +
                "The CSV in ~/rvp-credentials is plaintext — deliver it out of band, never commit it."
              );
              process.exit(1);
            }
            console.log("Credentials differ from the compromised set.");
          '

      - name: Production build
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://www.reddivaripalli.com
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
