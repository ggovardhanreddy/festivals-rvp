# ─────────────────────────────────────────────────────────────────────────────
# PR Checks — quality gates for pull requests. Never deploys.
#
# Production deploys run the same gates on push to main (deploy.yml), so no
# commit is ever checked twice: this workflow fires only on pull_request.
# ─────────────────────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://www.reddivaripalli.com
      NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL || 'https://pub-f2609804d6a040368903177488b01d2d.r2.dev' }}
      CMS_READ_EXIF: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Unit tests
        id: unit
        run: npm run test:unit

      # prepare:site + next build, once. No second build anywhere in this job.
      - name: Build
        id: build
        run: npm run build

      - name: Verify build output
        id: verify
        run: |
          set -euo pipefail
          npm run validate
          npm test

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "## ✅ PR checks passed"
              echo ""
              echo "Commit \`${GITHUB_SHA:0:7}\` — lint, typecheck, unit tests, build and site validation are green."
              echo "This workflow does not deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            failed="unknown"
            for pair in \
              "Lint:${{ steps.lint.outcome }}" \
              "Typecheck:${{ steps.typecheck.outcome }}" \
              "Unit tests:${{ steps.unit.outcome }}" \
              "Build:${{ steps.build.outcome }}" \
              "Verify build output:${{ steps.verify.outcome }}" ; do
              name="${pair%:*}"; outcome="${pair##*:}"
              if [ "$outcome" = "failure" ]; then failed="$name"; break; fi
            done
            {
              echo "## ❌ PR checks failed"
              echo ""
              echo "Failed step: **${failed}** (commit \`${GITHUB_SHA:0:7}\`)"
              echo ""
              echo "Open the failed step above for the full log. Nothing was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
