# Batch media optimize with Sharp + FFmpeg (NOT on Cloudflare Workers).
#
# Use when Admin browser upload cannot decode HEIC or transcode large video.
# Download the workflow artifact, then migrate to R2 / upload via Admin.
#
# Trigger: Actions → Media Optimize → Run workflow
name: Media Optimize

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this job was run"
        required: false
        default: "manual optimize"
  # Optional: drop a zip into the workflow via artifact upload in a future step.

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: npm ci

      - name: Prepare inbox
        run: |
          mkdir -p inbox .tmp/media-optimized
          # Place files under inbox/ before dispatch, or upload via a prior step.
          # If inbox is empty, write a tiny smoke fixture so the job documents usage.
          if [ -z "$(find inbox -type f ! -name '.gitkeep' 2>/dev/null | head -n 1)" ]; then
            echo "Inbox empty — creating smoke WebP via sharp fixture script"
            npx tsx -e "
              const sharp = require('sharp');
              const fs = require('fs');
              fs.mkdirSync('inbox', { recursive: true });
              sharp({
                create: { width: 800, height: 600, channels: 3, background: { r: 40, g: 90, b: 140 } }
              }).jpeg().toFile('inbox/smoke-fixture.jpg').then(() => console.log('fixture ok'));
            "
          fi

      - name: Run media:optimize
        run: npm run media:optimize -- --input ./inbox --out .tmp/media-optimized --force

      - name: Upload optimized artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-optimized
          path: .tmp/media-optimized
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          echo "### Media Optimize" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **media-optimized** artifact, then either:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Copy into \`public/images|thumbs|videos\` and run \`npm run media:migrate:r2\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Upload WebP/MP4 via Admin (already optimized)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Workers cannot run FFmpeg/Sharp for 1GB videos — this job exists for that gap." >> "$GITHUB_STEP_SUMMARY"
          if [ -f .tmp/media-optimized/manifest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 4000 .tmp/media-optimized/manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
